spring.application.name=baja-telemetry-api

# A 8080 (padrao do Spring) ja e usada por outro projeto nesta maquina.
# Nada no projeto depende deste numero -- trocar aqui basta.
server.port=8081

# O Actuator expoe so o /health por padrao. Explicito para nao virar surpresa
# quando alguem adicionar um endpoint sensivel sem perceber.
management.endpoints.web.exposure.include=health

# O banco de desenvolvimento vem do docker-compose.yml. Os testes NAO usam este
# endereco: eles sobem um Postgres proprio via Testcontainers (ADR-003).
# reWriteBatchedInserts agrupa varios INSERT num comando so. ATENCAO ao nome:
# `rewriteBatchedStatements` e do MySQL e o driver do Postgres IGNORA em silencio.
spring.datasource.url=jdbc:postgresql://localhost:5432/baja?reWriteBatchedInserts=true
spring.datasource.username=baja
spring.datasource.password=baja

# Compressao HTTP. A serie temporal e JSON muito repetitivo -- os mesmos seis
# nomes de campo em milhares de objetos -- entao comprime muito bem.
# Importa menos em localhost e MUITO no caso real: alguem no box, puxando o
# grafico pelo WiFi da equipe.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json
server.compression.min-response-size=2KB
