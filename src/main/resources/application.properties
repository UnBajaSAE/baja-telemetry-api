spring.application.name=baja-telemetry-api

# A 8080 (padrao do Spring) ja e usada por outro projeto nesta maquina.
# Nada no projeto depende deste numero -- trocar aqui basta.
server.port=8081

# O Actuator expoe so o /health por padrao. Explicito para nao virar surpresa
# quando alguem adicionar um endpoint sensivel sem perceber.
management.endpoints.web.exposure.include=health

# O banco de desenvolvimento vem do docker-compose.yml. Os testes NAO usam este
# endereco: eles sobem um Postgres proprio via Testcontainers (ADR-003).
spring.datasource.url=jdbc:postgresql://localhost:5432/baja
spring.datasource.username=baja
spring.datasource.password=baja
