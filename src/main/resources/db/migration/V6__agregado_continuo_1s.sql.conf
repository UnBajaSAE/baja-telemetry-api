# O Flyway envolve cada migration numa transacao. Criar um agregado continuo
# WITH DATA nao pode rodar dentro de uma -- o Postgres recusa com
#   "CREATE MATERIALIZED VIEW ... WITH DATA cannot run inside a transaction block"
#
# TRADE-OFF ACEITO: sem transacao, esta migration nao tem rollback automatico.
# Se falhar no meio, a view pode ficar criada sem a politica de atualizacao, e a
# correcao e manual. O risco e baixo porque sao dois comandos; a alternativa
# (WITH NO DATA) deixaria o historico existente sem materializar para sempre.
executeInTransaction=false
